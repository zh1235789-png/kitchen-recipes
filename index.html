<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="キッチン">
<meta name="theme-color" content="#65a30d">
<title>食材とレシピ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a2530; --sub:#6b7a89;
  --accent:#65a30d; --accent-soft:#ecfccb; --border:#e3e8ee;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#dc2626; --danger-bg:#fee2e2;
  --ok:#16a34a; --ok-bg:#dcfce7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1519; --card:#1a2229; --text:#e8edf2; --sub:#8b9aa8;
    --accent:#a3e635; --accent-soft:#283a12; --border:#2a343d;
    --warn:#fbbf24; --warn-bg:#3a2e10; --danger:#f87171; --danger-bg:#3d1a1a;
    --ok:#4ade80; --ok-bg:#0f2e1c;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#84cc16,#4d7c0f);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:700}
header .hsub{color:rgba(255,255,255,.88);font-size:12px;margin-top:2px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn-primary{color:#10200a}}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn + .btn{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
input[type=text],input[type=search],input[type=date],textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.field{margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--border)}
.seg button{flex:1;padding:8px 0;border-radius:8px;color:var(--sub);font-size:13px;font-weight:600}
.seg button.sel{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--sub);font-weight:600}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip.sel{color:#10200a}}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
/* 食材 */
.grp-h{font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 4px 6px;display:flex;justify-content:space-between}
.food{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
.food .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.food .meta{font-size:11.5px;color:var(--sub);font-weight:400;margin-top:2px}
.food.out .nm{color:var(--sub);font-weight:500}
.food .exp-soon{color:var(--warn);font-weight:700}
.food .exp-over{color:var(--danger);font-weight:700}
.stseg{flex-shrink:0;display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px}
.stseg button{padding:7px 7px;border-radius:8px;font-size:12px;font-weight:700;color:var(--sub);min-width:42px}
.stseg button.sel.have{background:var(--ok-bg);color:var(--ok)}
.stseg button.sel.low{background:var(--warn-bg);color:var(--warn)}
.stseg button.sel.out{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.edit-ic{flex-shrink:0;color:var(--sub);font-size:15px;padding:4px}
/* レシピ */
.rc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rc .t{font-size:15px;font-weight:700;line-height:1.4}
.rc .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--sub);border:1px solid var(--border)}
.rc .nut{font-size:12px;color:var(--sub);margin-top:5px}
.pfcline b{color:var(--text)}
.pf.p b{color:var(--danger)}
.pfcbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pfcbox div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center}
.pfcbox b{display:block;font-size:18px}
.pfcbox span{font-size:11px;color:var(--sub)}
.pfcbox .p b{color:var(--danger)}
.rc .miss{font-size:12.5px;margin-top:6px;line-height:1.5}
.can{color:var(--ok);font-weight:700}
.need{color:var(--warn)}
.fav{color:#eab308}
/* 詳細シート */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#sheet.on{display:block}
.sh-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;z-index:2}
.sh-head .ttl{flex:1;font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head button{padding:8px 10px;font-size:15px;font-weight:700;color:var(--accent)}
.sh-body{padding:14px;max-width:560px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.ing{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.ing:last-child{border-bottom:none}
.ing .mk{width:22px;flex-shrink:0;text-align:center}
.ing .nm{flex:1;min-width:0}
.ing .amt{color:var(--sub);font-size:13.5px;text-align:right;flex-shrink:0;max-width:45%}
.ing .opt{font-size:11px;color:var(--sub);margin-left:4px}
.ing .add{flex-shrink:0;font-size:12px;font-weight:700;color:var(--accent);padding:2px 6px;border:1px solid var(--accent);border-radius:7px}
ol.steps{padding-left:22px;font-size:14.5px;line-height:1.65}
ol.steps li{margin-bottom:8px}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.acts .btn{padding:11px 6px;font-size:13.5px}
.acts .btn + .btn{margin-top:0}
/* 買い物 */
.shop{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:6px}
.shop .nm{flex:1;min-width:0;font-size:15px}
.shop .from{font-size:11.5px;color:var(--sub)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.ck.on{background:var(--accent);border-color:var(--accent)}
.shop.done .nm{text-decoration:line-through;color:var(--sub)}
.x{flex-shrink:0;color:var(--sub);font-size:16px;padding:2px 6px}
/* タブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab-btn{flex:1;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;position:relative}
.tab-btn .ic{font-size:21px;line-height:1}
.tab-btn.sel{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:700}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 8px}
.ver{text-align:center;color:var(--sub);font-size:11px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,30,20,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">🥬 食材</h1>
  <div class="hsub" id="hSub"></div>
</header>
<main id="main"></main>
<div id="sheet"></div>
<div id="toast"></div>
<nav class="tabbar">
  <button data-tab="foods" class="tab-btn"><span class="ic">🥬</span>食材</button>
  <button data-tab="recipes" class="tab-btn"><span class="ic">📖</span>レシピ</button>
  <button data-tab="shop" class="tab-btn"><span class="ic">🛒</span>買い物<span class="badge" id="shopBadge" style="display:none"></span></button>
  <button data-tab="settings" class="tab-btn"><span class="ic">⚙️</span>設定</button>
</nav>
<script>
const APP_VERSION = '2026-11-25.5';
const KEY = 'kitchen.v1';
const PLACES = ['冷蔵', '冷凍', '常温', '調味料'];
const STATUS = { have: 'あり', low: '少ない', out: 'なし' };

// ---------- 保存（localStorage は必ずラッパ経由） ----------
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 名前の照合 ----------
// 在庫の「冷凍鶏胸肉」とレシピの「鶏むね肉」、「おろしにんにく」と「ニンニクチューブ」を同じものと見なす
function kataToHira(s){ return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(name){
  let s = String(name || '');
  s = s.replace(/[（(][^）)]*[）)]/g, '');
  s = s.replace(/[\s　・]/g, '');
  s = kataToHira(s).toLowerCase();
  s = s.replace(/生姜/g, 'しょうが').replace(/大蒜|にんにく/g, 'にんにく').replace(/胸/g, 'むね')
       .replace(/鯖/g, 'さば').replace(/鮭/g, 'さけ').replace(/醤油/g, 'しょうゆ').replace(/玉子/g, '卵')
       .replace(/人参/g, 'にんじん').replace(/舞茸/g, 'まいたけ').replace(/葱/g, 'ねぎ').replace(/胡椒/g, 'こしょう').replace(/味醂/g, 'みりん');
  s = s.replace(/^(冷凍|乾燥|すりおろし|おろし|かっと|むき|ささがき|どらいぱっく|市販の|生)/, '');
  s = s.replace(/^(冷凍|かっと|むき)/, '');
  s = s.replace(/(ちゅーぶ|すりおろし)$/, '');
  s = s.replace(/^すり(ごま)/, '$1');
  return s;
}
// いつも家にある前提で、足りない判定に数えないもの
const STAPLES = ['水', 'お湯', '湯', '塩', 'こしょう', '塩こしょう', '油', 'さらだ油', '氷'];
function isStaple(name){ return STAPLES.includes(norm(name)); }
function nameMatch(ing, food){
  const a = norm(ing), b = norm(food);
  if (!a || !b) return false;
  if (a === b) return true;
  // 「ごま」を持っていても「ごま油」は別物。「酢」「塩」「粉」も同じ
  const suffixOther = (long, short) => /^(油|酢|塩|粉)$/.test(long.replace(short, ''));
  // 「銀さけ」と「さけ」、「赤味噌」と「味噌」は同じ。長い名前の残りが3文字以上なら別物（さば缶味噌と味噌、ブロッコリーとスプラウトなど）
  const ok = (long, short) => !suffixOther(long, short) && long.length - short.length <= 2;
  if (a.includes(b)) return ok(a, b);
  if (b.includes(a)) return ok(b, a);
  return false;
}
function findFood(ingName, foods){
  const list = foods || S.foods;
  const n = norm(ingName);
  const hits = list.filter(f => nameMatch(ingName, f.name));
  if (!hits.length) return null;
  // 在庫ありを優先し、名前の長さが近いものを選ぶ
  const score = f => (norm(f.name) === n ? 0 : 1) * 100 + (f.status === 'out' ? 50 : 0) + Math.abs(norm(f.name).length - n.length);
  return hits.sort((x, y) => score(x) - score(y))[0];
}
// レシピの材料それぞれが家にあるか
function recipeCheck(r, foods){
  const rows = (r.ingredients || []).map(ing => {
    if (isStaple(ing.name)) return { ing, state: 'staple', food: null };
    const f = findFood(ing.name, foods);
    if (f && f.status !== 'out') return { ing, state: 'have', food: f };
    return { ing, state: ing.optional ? 'optional' : 'missing', food: f };
  });
  const missing = rows.filter(x => x.state === 'missing');
  return { rows, missing };
}

// ---------- 貼り付けたレシピ文の読み取り ----------
const AMOUNT_RE = /(\d|[０-９]|少々|適量|適宜|ひとつまみ|大さじ|小さじ|好み|各|半|1\/|お好み|\d+g)/;
function parseIngLine(line){
  let s = String(line).replace(/^[\s　]*([-・*•●○◦▪︎]|\d+[.)．]|[①-⑳])[\s　]*/, '').trim();
  if (!s) return null;
  const optional = /好みで|お好み|あれば|なくても可|なくてもよい|仕上げ用/.test(s);
  let name = s, amount = '';
  if (s.includes('|')) { [name, amount] = s.split('|').map(x => x.trim()); }
  else {
    const m = s.match(/^(.+?)[\s　]+(.+)$/);
    if (m && AMOUNT_RE.test(m[2])) { name = m[1]; amount = m[2]; }
    else {
      const m2 = s.match(/^(.+?)((?:\d|[０-９]|少々|適量|適宜|ひとつまみ|大さじ|小さじ|各|半|1\/).*)$/);
      if (m2 && m2[1].length >= 1) { name = m2[1]; amount = m2[2]; }
    }
  }
  name = name.replace(/^(仕上げ用|トッピング|ベース|メイン)[:：]/, '').trim();
  amount = amount.replace(/[（(](好みで|お好みで|あれば|なくても可)[）)]/g, '').trim();
  name = name.replace(/[（(](好みで|お好みで|あれば|なくても可)[）)]/g, '').trim();
  if (!name) return null;
  return { name, amount, optional };
}
function splitInlineList(s){
  // 「ほうれん草1束（200g）、にんじん1/2本」→ 括弧の中の読点では切らない
  const out = []; let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '（' || ch === '(') depth++;
    if (ch === '）' || ch === ')') depth = Math.max(0, depth - 1);
    if ((ch === '、' || ch === '，' || ch === '／') && depth === 0) { if (cur.trim()) out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function autoTags(r){
  const text = [r.title, r.tool, (r.ingredients||[]).map(i => i.name).join(' '), (r.steps||[]).join(' ')].join(' ');
  const tags = [];
  const T = [
    [/cook4me|クックフォーミー|圧力/i, 'Cook4me'], [/レンジグリル/, 'レンジグリル'], [/シリコンスチーマー|スチーマー/, 'スチーマー'],
    [/電子レンジ|600W|レンジ/, 'レンジ'], [/フライパン|炒め/, 'フライパン'], [/炊飯器/, '炊飯器'],
    [/鶏(むね|胸)/, '鶏むね'], [/鮭/, '鮭'], [/砂肝/, '砂肝'], [/えび|エビ|海老/, 'えび'], [/さば|鯖/, 'さば'],
    [/ツナ/, 'ツナ'], [/豚/, '豚'], [/卵/, '卵'], [/パスタ/, 'パスタ'], [/粥|雑炊|リゾット|丼|ご飯|ごはん|米/, 'ご飯もの'],
    [/スープ|汁|チゲ/, '汁物'], [/サラダ(?!チキン)/, 'サラダ'], [/作り置き|常備菜|保存/, '作り置き'],
  ];
  for (const [re, t] of T) if (re.test(text) && !tags.includes(t)) tags.push(t);
  if (tags.includes('レンジグリル') || tags.includes('スチーマー')) { const i = tags.indexOf('レンジ'); if (i < 0) tags.push('レンジ'); }
  return tags;
}
function parseRecipeText(text){
  const lines = String(text || '').split(/\r?\n/);
  const r = { title: '', ingredients: [], steps: [], nutrition: '', notes: '', servings: '', tool: '' };
  let mode = 'head'; const notes = [];
  for (let raw of lines) {
    const line = raw.trim();
    if (!line || /^-{3,}$/.test(line)) continue;
    const plain = line.replace(/\*\*/g, '').replace(/^#+\s*/, '').trim();
    if (!r.title) {
      if (/^#/.test(line) || mode === 'head') {
        r.title = plain.replace(/^([①-⑳]|\d+[.．)])\s*/, '').trim();
        const tm = r.title.match(/[（(]([^）)]*(レンジ|スチーマー|グリル|Cook4me|フライパン|炊飯器)[^）)]*)[）)]/i);
        if (tm) r.tool = tm[1];
        continue;
      }
    }
    if (/^(材料|【材料】)/.test(plain)) {
      mode = 'ing';
      const sm = plain.match(/[（(]([^）)]*(人分|食分|枚分|個分)[^）)]*)[）)]/);
      if (sm) r.servings = sm[1];
      const inline = plain.replace(/^【?材料】?([（(][^）)]*[）)])?\s*[:：]?\s*/, '');
      if (inline) splitInlineList(inline).forEach(x => { const p = parseIngLine(x); if (p) r.ingredients.push(p); });
      continue;
    }
    if (/^(作り方|手順|【作り方】|設定)/.test(plain)) {
      mode = 'steps';
      const inline = plain.replace(/^【?(作り方|手順|設定)】?\s*[:：]?\s*/, '');
      if (inline) r.steps.push(inline);
      continue;
    }
    if (/^(目安|おかずだけ|栄養|PFC)/.test(plain) || /^\s*約?\d+\s*kcal/.test(plain)) {
      r.nutrition = (r.nutrition ? r.nutrition + ' ' : '') + plain.replace(/^(目安|おかずだけ|栄養|PFC)\s*[:：]?\s*/, '');
      continue;
    }
    if (/^(💡|※|ポイント|コツ|メモ)/.test(plain)) { notes.push(plain); mode = 'notes'; continue; }
    // 材料の後に「作り方」の見出しなしで番号付きの文が続いたら手順とみなす
    if (mode === 'ing' && (/^(\d+[.．)]|[①-⑳])\s*/.test(line) || /。$/.test(plain))) mode = 'steps';
    if (mode === 'ing') {
      if (/^([-・*•]|\d)/.test(line) || line.length < 30) {
        if (/[、，]/.test(plain) && !/^\d+[.．)]/.test(plain)) splitInlineList(plain.replace(/^[-・*•]\s*/, '')).forEach(x => { const p = parseIngLine(x); if (p) r.ingredients.push(p); });
        else { const p = parseIngLine(plain); if (p) r.ingredients.push(p); }
        continue;
      }
      mode = 'steps';
    }

  };
  const out = [];

  for (const place of PLACES) for (const name of (G[place] || [])) out.push({ id: seedFoodId(name), name, place, status: 'have', exp: '', memo: '', updated: t });

// 初期データの id は端末ごとに同じにする（別々の id だと同期で同じ食材が2つになる）
function seedFoodId(name){ return 'seed-f-' + name; }
function freshState(){ return { v: 3, foods: seedFoods(), recipes: seedRecipes(), shop: [], deleted: {}, seededAt: todayStr(), seedNotice: true }; }

// ---------- 状態 ----------
let S = null;
let saveOk = true;
function validState(o){ return o && typeof o === 'object' && Array.isArray(o.foods) && Array.isArray(o.recipes) && Array.isArray(o.shop); }
function load(){
  const raw = lsGet(KEY);
  // 初期データは時刻を古いまま保存する（新しい端末の初期データが、ほかの端末の変更を上書きしないように）
  if (raw == null) { S = freshState(); takeSnapshot(); save(); return; }
  try {
    const o = JSON.parse(raw);
    if (!validState(o)) throw new Error('形式が違う');
    S = o;
    migrate();
    takeSnapshot();
  } catch (e) {
    // 壊れたデータは消さずに退避してから初期化する
    lsSet(KEY + '.broken-' + Date.now(), raw);
    S = freshState();
    S.brokenNotice = true;
    takeSnapshot(); save();
  }
}
// v1（同期前）: 初期食材の id が端末ごとにばらばらだったので、そろえる
function migrate(){
  if (!S.deleted || typeof S.deleted !== 'object') S.deleted = {};
  if ((S.v || 1) < 2) {
    const seedNames = new Set(seedFoods().map(f => f.name));
    const used = new Set();
    for (const f of S.foods) {
      if (seedNames.has(f.name) && !used.has(f.name)) { f.id = seedFoodId(f.name); used.add(f.name); }
    }
    S.v = 2;
    lsSet(KEY, JSON.stringify(S));
  }
  // v2→v3: 初期レシピにPFCを入れる（自分で入れた値は触らない）
  if (S.v < 3) {
    for (const r of S.recipes) if (r && !r.pfc) r.pfc = seedPfc(r.id) || parsePfc(r.nutrition);
    S.v = 3;
    lsSet(KEY, JSON.stringify(S));
  }
}

// ---------- 端末間同期のための変更記録 ----------
// 食材・レシピ・買い物の1件ごとに「最後に変えた時刻」(updated) を持たせ、消したものは墓標 (S.deleted) で伝える。
// 前回保存した中身(SNAP)と比べて、変わったものだけ時刻を付け直す。呼び出し元は save() するだけでよい。
const COLS = ['foods', 'recipes', 'shop'];
let SNAP = {};
function itemSig(x){ const c = Object.assign({}, x); delete c.updated; return JSON.stringify(c); }
function takeSnapshot(){
  SNAP = {};
  for (const col of COLS) for (const x of (S[col] || [])) if (x && x.id) SNAP[col + ':' + x.id] = itemSig(x);
}
function stampChanges(){
  const now = Date.now(), seen = new Set();
  if (!S.deleted || typeof S.deleted !== 'object') S.deleted = {};
  for (const col of COLS) for (const x of (S[col] || [])) {
    if (!x || !x.id) continue;
    const k = col + ':' + x.id; seen.add(k);
    if (SNAP[k] !== itemSig(x)) { x.updated = now; delete S.deleted[k]; }
  }
  for (const k of Object.keys(SNAP)) if (!seen.has(k)) S.deleted[k] = now;
  takeSnapshot();
}
function save(){
  stampChanges();
  saveOk = lsSet(KEY, JSON.stringify(S));
  syncSoon();
  return saveOk;
}

// 相手（Gist）のデータと1件ずつ比べて新しい方を採る。相手が空・壊れていれば何もしない（自分のデータを消さない）
function mergeRemote(R){
  if (!R || R.app !== 'kitchen-recipes' || !validState(R)) return false;
  const rdel = (R.deleted && typeof R.deleted === 'object') ? R.deleted : {};
  const mdel = S.deleted || {};
  // 墓標は両方の分を全部引き継ぐ（両端末の配列から消えた項目の墓標を落とすと、古い端末から生き返る）
  const deleted = {};
  for (const src of [mdel, rdel]) for (const k of Object.keys(src)) if (typeof src[k] === 'number') deleted[k] = Math.max(deleted[k] || 0, src[k]);
  for (const col of COLS) {
    const mine = new Map((S[col] || []).filter(x => x && x.id).map(x => [x.id, x]));
    const theirs = new Map((R[col] || []).filter(x => x && x.id).map(x => [x.id, x]));
    const ids = new Set([...mine.keys(), ...theirs.keys()]);
    const out = [];
    for (const id of ids) {
      const k = col + ':' + id;
      const m = mine.get(id), t = theirs.get(id);
      const mt = m ? (m.updated || 0) : -1, tt = t ? (t.updated || 0) : -1;
      const win = (t && tt > mt) ? t : (m || t);
      const wt = Math.max(mt, tt, 0);
      const del = Math.max(mdel[k] || 0, rdel[k] || 0);
      if (del && del >= wt) { deleted[k] = del; continue; }
      delete deleted[k];
      out.push(win);
    }
    // 自分の並び順を保ち、相手にしかないものを先頭に
    const order = new Map([...(S[col] || [])].map((x, i) => [x && x.id, i]));
    out.sort((a, b) => (order.has(a.id) ? order.get(a.id) : -1) - (order.has(b.id) ? order.get(b.id) : -1));
    S[col] = out;
  }
  // 別々の端末で同じ名前の食材・買い物を足したときは1つにまとめる（新しい方を残す）
  for (const col of ['foods', 'shop']) {
    const byName = new Map();
    for (const x of S[col]) {
      const n = norm(x.name), prev = byName.get(n);
      if (!prev) { byName.set(n, x); continue; }
      const [keep, drop] = (x.updated || 0) > (prev.updated || 0) ? [x, prev] : [prev, x];
      byName.set(n, keep);
      deleted[col + ':' + drop.id] = Math.max(keep.updated || 0, 1);
    }
    S[col] = S[col].filter(x => byName.get(norm(x.name)) === x);
  }
  // 墓標は60日で捨てる（それより古い端末はまず無い）
  const cut = Date.now() - 60 * 86400000;
  for (const k of Object.keys(deleted)) if (deleted[k] < cut) delete deleted[k];
  S.deleted = deleted;
  takeSnapshot();
  lsSet(KEY, JSON.stringify(S));
  return true;
}

// ---------- 同期（GitHubの非公開Gist。ほかの自作アプリと同じトークンを使い回せる） ----------
const SYNC_KEY = 'kitchen.sync';            // { token, gistId, last, state, err }
const GIST_FILE = 'kitchen-recipes.json', GIST_DESC = 'kitchen-recipes sync (auto)';
let SY = (() => { try { return JSON.parse(lsGet(SYNC_KEY) || '{}') || {}; } catch (e) { return {}; } })();
function saveSY(){ lsSet(SYNC_KEY, JSON.stringify(SY)); }
let syncing = false, syncAgain = false, syncTimer = null;
function syncDoc(){ return { app: 'kitchen-recipes', v: 2, foods: S.foods, recipes: S.recipes, shop: S.shop, deleted: S.deleted || {} }; }
async function gh(path, opts){
  const res = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opts || {}, {
    headers: { 'Authorization': 'Bearer ' + SY.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
  }));
  if (!res.ok) throw new Error(
    res.status === 401 ? 'トークンが無効か期限切れです'
    : (res.status === 403 || res.status === 404) ? 'トークンにgist権限がありません（' + res.status + '）'
    : 'GitHubエラー ' + res.status);
  return res.status === 204 ? null : res.json();
}
async function syncNow(){
  if (!SY.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; SY.state = 'syncing'; paintSyncStatus();
  let changed = false;
  try {
    if (!SY.gistId) {
      const list = await gh('/gists?per_page=100');
      const g = list.find(x => x.files && x.files[GIST_FILE]);
      SY.gistId = g ? g.id : (await gh('/gists', { method: 'POST', body: JSON.stringify({
        description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(syncDoc()) } } }) })).id;
    }
    const g = await gh('/gists/' + SY.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remoteText = f ? f.content : '';
    if (f && f.truncated) remoteText = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
    let remote = null; try { remote = JSON.parse(remoteText); } catch (e) {}
    const before = JSON.stringify(syncDoc());
    mergeRemote(remote);
    const mineText = JSON.stringify(syncDoc());
    changed = mineText !== before;
    if (mineText !== remoteText) await gh('/gists/' + SY.gistId, { method: 'PATCH',
      body: JSON.stringify({ files: { [GIST_FILE]: { content: mineText } } }) });
    SY.last = Date.now(); SY.state = 'ok'; SY.err = '';
  } catch (e) {
    SY.state = 'err';
    SY.err = (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'オフライン（次にネットにつながったとき同期します）' : e.message;
  }
  saveSY(); syncing = false;
  // 入力中の画面を壊さないよう、データが変わったときか設定タブのときだけ描き直す
  if (changed && !(SHEET && (SHEET.mode === 'edit' || SHEET.mode === 'food'))) { render(); if (SHEET) renderSheet(); }
  else if (UI.tab === 'settings' && !SHEET) render();
  else paintSyncStatus();
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function syncSoon(){ if (!SY.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2000); }
function syncText(){
  if (!SY.token) return '';
  if (SY.state === 'syncing') return '☁️ 同期中…';
  if (SY.state === 'err') return '⚠️ 同期エラー：' + SY.err;
  if (SY.last) { const d = new Date(SY.last); return '☁️ 同期済み ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  return '☁️ 同期待ち';
}
function paintSyncStatus(){
  const el = document.getElementById('syncStatus');
  if (el && el.nodeType) { el.textContent = syncText(); el.style.color = SY.state === 'err' ? 'var(--danger)' : ''; }
}
function renderSyncCard(){
  if (SY.token) return '<div class="card"><h2>☁️ 同期（GitHubの非公開Gist）</h2><div class="sub" id="syncStatus" style="margin-bottom:10px;' + (SY.state === 'err' ? 'color:var(--danger)' : '') + '">' + esc(syncText()) + '</div>'

const UI = { tab: 'foods', place: 'all', showOut: true, foodQ: '', recQ: '', recFilter: 'all', recTag: '', editFood: null };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800);
}
function daysUntil(dateStr){
  if (!dateStr) return null;
  const a = new Date(todayStr() + 'T00:00:00'), b = new Date(dateStr + 'T00:00:00');
  if (isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}
function expLabel(f){
  const d = daysUntil(f.exp);
  if (d == null) return '';
  if (d < 0) return '<span class="exp-over">期限切れ（' + (-d) + '日前）</span>';
  if (d === 0) return '<span class="exp-over">今日まで</span>';
  if (d <= 3) return '<span class="exp-soon">あと' + d + '日</span>';
  return '期限 ' + f.exp.slice(5).replace('-', '/');
}

function foodOrder(a, b){ return ((daysUntil(a.exp) ?? 999) - (daysUntil(b.exp) ?? 999)) || a.name.localeCompare(b.name, 'ja'); }
function setFoodStatus(id, st){
  const f = S.foods.find(x => x.id === id); if (!f || !STATUS[st] || f.status === st) return;
  f.status = st;
  if (st !== 'have') f.noShop = false;
  f.updated = Date.now(); // save() の stampChanges でも付くが、同期の基準なので明示しておく
  save();
}
function foodListHtml(){
  let h = '';
  const q = norm(UI.foodQ);
  const places = UI.place === 'all' ? PLACES : [UI.place];
  let any = false;
  for (const p of places) {
    let items = S.foods.filter(f => f.place === p && (UI.showOut || f.status !== 'out') && (!q || norm(f.name).includes(q)));
    if (!items.length) continue;
    any = true;
    // 在庫の状態では並べ替えない（押した食材が下へ逃げないように）
    items.sort(foodOrder);
    const haveN = items.filter(f => f.status !== 'out').length;
    h += '<div class="grp-h"><span>' + p + '</span><span>' + haveN + ' / ' + items.length + '</span></div>';
    for (const f of items) {
      const meta = [expLabel(f), f.memo ? esc(f.memo) : ''].filter(Boolean).join(' ・ ');
      h += '<div class="food ' + f.status + '"><button class="nm" style="text-align:left" data-act="edit-food" data-id="' + f.id + '">' + esc(f.name) + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</button>'
        + '<div class="stseg">' + Object.keys(STATUS).map(k => '<button class="' + k + (f.status === k ? ' sel' : '') + '" data-act="setst" data-id="' + f.id + '" data-v="' + k + '">' + STATUS[k] + '</button>').join('') + '</div></div>';
    }
  }
  if (!any) h += '<div class="empty">' + (q ? '見つかりません。上の欄から追加できます。' : '食材がありません') + '</div>';
  return h;
}

function renderRecipes(){
  let h = '<input type="search" id="recQ" placeholder="🔍 レシピ・材料で検索" value="' + esc(UI.recQ) + '" style="margin-bottom:10px">';
  const filters = [['all', 'すべて'], ['can', '✅ 今作れる'], ['near', 'あと1〜2品'], ['protein', '💪 P多い順'], ['fav', '⭐ お気に入り'], ['often', '🍳 よく作る']];
  h += '<div class="chips">' + filters.map(([k, l]) => '<button class="chip' + (UI.recFilter === k ? ' sel' : '') + '" data-act="rfilter" data-v="' + k + '">' + l + '</button>').join('') + '</div>';
  const tagCount = {};
  S.recipes.forEach(r => (r.tags || []).forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
  const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]);
  if (tags.length) h += '<div class="chips">' + tags.map(t => '<button class="chip' + (UI.recTag === t ? ' sel' : '') + '" data-act="rtag" data-v="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>';

function recipeListHtml(){
  let h = '';
  const list = filterRecipes();
  if (!list.length) h += '<div class="empty">該当するレシピがありません</div>';
  for (const { r, chk } of list) {
    const m = chk.missing;
    const missTxt = m.length === 0 ? '<span class="can">✅ 今ある食材で作れる</span>' : '<span class="need">足りない: ' + m.map(x => esc(x.ing.name)).join('、') + '</span>';
    const cookedN = (r.cooked || []).length;
    h += '<button class="rc" data-act="open-recipe" data-id="' + r.id + '"><div class="t">' + (r.fav ? '<span class="fav">★</span> ' : '') + esc(r.title) + '</div>'
      + '<div class="tags">' + (r.tags || []).slice(0, 5).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + (cookedN ? '<span class="tag">🍳' + cookedN + '回</span>' : '') + '</div>'
      + (r.pfc ? '<div class="nut pfcline">' + pfcHtml(r.pfc) + '</div>' : (r.nutrition ? '<div class="nut">' + esc(r.nutrition) + '</div>' : ''))
      + '<div class="miss">' + missTxt + '</div></button>';
  }
  return h;
}
function pfcHtml(x){
  return (x.per ? '<span>' + esc(x.per) + '</span> ' : '') + (x.kcal != null ? '<b>' + x.kcal + '</b>kcal ' : '')
    + ['p', 'f', 'c'].filter(k => x[k] != null).map(k => '<span class="pf ' + k + '">' + k.toUpperCase() + ' <b>' + x[k] + '</b></span>').join(' ');
}
function filterRecipes(){
  const q = norm(UI.recQ);
  let list = S.recipes.map(r => ({ r, chk: recipeCheck(r) }));
  if (q) list = list.filter(({ r }) => norm(r.title).includes(q) || (r.ingredients || []).some(i => norm(i.name).includes(q) || (q.length >= 2 && nameMatch(i.name, UI.recQ))) || (r.tags || []).some(t => norm(t).includes(q)));
  if (UI.recTag) list = list.filter(({ r }) => (r.tags || []).includes(UI.recTag));
  if (UI.recFilter === 'can') list = list.filter(x => x.chk.missing.length === 0);
  if (UI.recFilter === 'near') list = list.filter(x => x.chk.missing.length >= 1 && x.chk.missing.length <= 2);
  if (UI.recFilter === 'fav') list = list.filter(x => x.r.fav);
  if (UI.recFilter === 'protein') list = list.filter(x => x.r.pfc && x.r.pfc.p != null).sort((a, b) => b.r.pfc.p - a.r.pfc.p);
  else if (UI.recFilter === 'often') list = list.filter(x => (x.r.cooked || []).length > 0).sort((a, b) => b.r.cooked.length - a.r.cooked.length);
  else list.sort((a, b) => (a.chk.missing.length - b.chk.missing.length) || ((b.r.fav ? 1 : 0) - (a.r.fav ? 1 : 0)) || a.r.title.localeCompare(b.r.title, 'ja'));
  return list;
}

// 買い物リスト = 「少ない・なし」の食材 ＋ 手で足したもの
function shopItems(){
  const auto = S.foods.filter(f => f.status !== 'have' && !f.noShop).map(f => ({ kind: 'food', id: f.id, name: f.name, from: f.place + '・' + STATUS[f.status], done: false }));
  const manual = S.shop.map(x => ({ kind: 'manual', id: x.id, name: x.name, from: x.from || '', done: !!x.done }));
  // 手入力と在庫が同じものなら在庫側に寄せる
  const autoNames = auto.map(a => norm(a.name));
  return auto.concat(manual.filter(m => !autoNames.includes(norm(m.name))));
}

// ---------- レシピ詳細・編集 ----------
let SHEET = null; // {mode:'view'|'edit', id}
function openSheet(mode, id){ SHEET = { mode, id }; renderSheet(); document.getElementById('sheet').classList.add('on'); document.getElementById('sheet').scrollTop = 0; }
function closeSheet(){ SHEET = null; const el = document.getElementById('sheet'); el.classList.remove('on'); el.innerHTML = ''; render(); }
function getRecipe(id){ return S.recipes.find(r => r.id === id); }
function renderSheet(){
  const el = document.getElementById('sheet');
  if (!SHEET) return;
  if (SHEET.mode === 'food') { el.innerHTML = foodSheetHtml(); return; }
  if (SHEET.mode === 'view') {
    const r = getRecipe(SHEET.id); if (!r) { closeSheet(); return; }
    const chk = recipeCheck(r);
    let h = '<div class="sh-head"><button data-act="close-sheet">‹ 戻る</button><div class="ttl">' + esc(r.title) + '</div><button data-act="fav" data-id="' + r.id + '">' + (r.fav ? '★' : '☆') + '</button></div><div class="sh-body">';
    h += '<div class="card"><div style="font-size:18px;font-weight:700;line-height:1.4">' + esc(r.title) + '</div>';
    const meta = [r.tool, r.servings].filter(Boolean).join(' ・ ');
    if (meta) h += '<div class="sub" style="margin-top:4px">' + esc(meta) + '</div>';
    if (r.pfc) h += '<div class="pfcbox">' + [['kcal', 'kcal', r.pfc.kcal], ['p', 'P', r.pfc.p], ['f', 'F', r.pfc.f], ['c', 'C', r.pfc.c]].map(([k, l, v]) => '<div class="' + k + '"><b>' + (v != null ? v : '–') + '</b><span>' + l + (k === 'kcal' ? '' : ' g') + '</span></div>').join('') + '</div><div class="sub" style="margin-top:4px">' + esc(r.pfc.per || '') + ' ・ 概算</div>';
    if (r.nutrition) h += '<div style="margin-top:6px;font-size:13px">📊 ' + esc(r.nutrition) + '</div>';
    if ((r.tags || []).length) h += '<div class="tags" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">' + r.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
    h += '</div>';
    h += '<div class="notice ' + (chk.missing.length ? '' : 'ok') + '">' + (chk.missing.length ? '足りない: ' + chk.missing.map(x => esc(x.ing.name)).join('、') : '✅ 今ある食材で作れます') + '</div>';
    h += '<div class="acts"><button class="btn btn-primary" data-act="cooked" data-id="' + r.id + '">🍳 作った</button><button class="btn btn-secondary" data-act="missing-to-shop" data-id="' + r.id + '"' + (chk.missing.length ? '' : ' disabled style="opacity:.5"') + '>🛒 不足を買い物へ</button></div>';
    h += '<div class="card"><h2>材料' + (r.servings ? '<span class="sub">（' + esc(r.servings) + '）</span>' : '') + '</h2>';
    for (const row of chk.rows) {
      const mk = row.state === 'have' ? '✅' : row.state === 'staple' ? '・' : row.state === 'optional' ? '◽' : '❌';
      h += '<div class="ing"><span class="mk">' + mk + '</span><span class="nm">' + esc(row.ing.name) + (row.ing.optional ? '<span class="opt">好みで</span>' : '') + (row.food && norm(row.food.name) !== norm(row.ing.name) ? '<div class="sub">在庫: ' + esc(row.food.name) + (row.food.status !== 'have' ? '（' + STATUS[row.food.status] + '）' : '') + '</div>' : '') + '</span><span class="amt">' + esc(row.ing.amount) + '</span>'
        + (row.state === 'missing' || row.state === 'optional' ? '<button class="add" data-act="ing-to-shop" data-id="' + r.id + '" data-name="' + esc(row.ing.name) + '">＋買う</button>' : '') + '</div>';
    }
    h += '<p class="sub" style="margin-top:6px">✅ 家にある ❌ ない ◽ 好みで（なくても可） ・ 水・塩・こしょう・油は数えません</p></div>';
    if ((r.steps || []).length) h += '<div class="card"><h2>作り方</h2><ol class="steps">' + r.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></div>';
    if (r.notes) h += '<div class="card"><h2>メモ</h2><div class="pre">' + esc(r.notes) + '</div></div>';
    const cooked = r.cooked || [];
    h += '<div class="card"><h2>記録</h2><div class="sub">' + (cooked.length ? '作った回数 ' + cooked.length + '回 ・ 最後 ' + esc(cooked[cooked.length - 1]) : 'まだ作った記録はありません') + (r.source ? '<br>出典: ' + esc(r.source) : '') + '</div>'
      + (cooked.length ? '<button class="sub" style="margin-top:6px;text-decoration:underline" data-act="uncook" data-id="' + r.id + '">最後の記録を取り消す</button>' : '') + '</div>';
    h += '<button class="btn btn-ghost" data-act="edit-recipe" data-id="' + r.id + '">✏️ 編集</button><button class="btn btn-danger" data-act="del-recipe" data-id="' + r.id + '">🗑 削除</button>';
    h += '</div>';
    el.innerHTML = h;
    return;
  }
  // 編集
  const r = SHEET.id ? getRecipe(SHEET.id) : null;
  const d = SHEET.draft || (r ? JSON.parse(JSON.stringify(r)) : { title: '', tool: '', servings: '', nutrition: '', ingredients: [], steps: [], notes: '', source: '', tags: [] });
  SHEET.draft = d;
  const ingText = d.ingredients.map(i => (i.optional ? '?' : '') + i.name + (i.amount ? ' | ' + i.amount : '')).join('\n');
  let h = '<div class="sh-head"><button data-act="' + (r ? 'cancel-edit' : 'close-sheet') + '">キャンセル</button><div class="ttl">' + (r ? 'レシピを編集' : 'レシピを追加') + '</div><button data-act="save-recipe">保存</button></div><div class="sh-body">';
  if (!r) h += '<div class="card"><h2>📋 貼り付けて読み取る</h2><textarea id="pasteText" placeholder="Claudeの回答などをそのまま貼り付け（タイトル・材料・作り方・目安）" style="min-height:120px"></textarea><button class="btn btn-secondary" style="margin-top:8px" data-act="parse-paste">読み取って下の欄に入れる</button></div>';
  h += '<div class="card">'
    + '<div class="field"><label>料理名</label><input type="text" id="eTitle" value="' + esc(d.title) + '"></div>'
    + '<div class="row"><div class="field" style="flex:1"><label>器具</label><input type="text" id="eTool" value="' + esc(d.tool) + '" placeholder="Cook4me・レンジ など"></div><div class="field" style="flex:1"><label>分量</label><input type="text" id="eServ" value="' + esc(d.servings) + '" placeholder="2食分"></div></div>'
    + '<div class="field"><label>材料（1行に1つ。「名前 | 量」。好みでのものは先頭に ?）</label><textarea id="eIng" style="min-height:160px">' + esc(ingText) + '</textarea></div>'
    + '<div class="field"><label>作り方（1行に1手順）</label><textarea id="eSteps" style="min-height:140px">' + esc(d.steps.join('\n')) + '</textarea></div>'
    + '<div class="field"><label>PFC（何あたり・kcal・P・F・C）</label><div class="row" style="margin-bottom:6px"><input type="text" id="ePer" value="' + esc((d.pfc && d.pfc.per) || '1食') + '" placeholder="1食"></div>'
    + '<div class="row">' + [['eKcal', 'kcal', 'kcal'], ['eP', 'P', 'p'], ['eF', 'F', 'f'], ['eC', 'C', 'c']].map(([id, ph, k]) => '<input type="text" inputmode="decimal" id="' + id + '" placeholder="' + ph + '" value="' + (d.pfc && d.pfc[k] != null ? d.pfc[k] : '') + '">').join('') + '</div></div>'
    + '<div class="field"><label>栄養メモ（食物繊維・塩分など）</label><input type="text" id="eNut" value="' + esc(d.nutrition) + '" placeholder="食物繊維6g／塩分1.5g"></div>'
    + '<div class="field"><label>タグ（「、」区切り。空なら自動）</label><input type="text" id="eTags" value="' + esc((d.tags || []).join('、')) + '"></div>'
    + '<div class="field"><label>メモ</label><textarea id="eNotes">' + esc(d.notes) + '</textarea></div>'
    + '<div class="field"><label>出典</label><input type="text" id="eSrc" value="' + esc(d.source) + '"></div>'
    + '</div><button class="btn btn-primary" data-act="save-recipe">保存</button></div>';
  el.innerHTML = h;
}
function readEditForm(){
  const v = id => (document.getElementById(id) || {}).value || '';
  const ingredients = v('eIng').split(/\r?\n/).map(line => {
    const t = line.trim(); if (!t) return null;
    const optional = t.startsWith('?') || t.startsWith('？');
    const body = t.replace(/^[?？]\s*/, '');
    if (body.includes('|')) { const [n, a = ''] = body.split('|'); return n.trim() ? { name: n.trim(), amount: a.trim(), optional } : null; }
    const p = parseIngLine(body); if (p) p.optional = p.optional || optional; return p;
  }).filter(Boolean);
  const n = id => { const t = v(id).trim().replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)); if (t === '') return null; const x = parseFloat(t); return isNaN(x) ? null : Math.round(x * 10) / 10; };
  let pfc = { kcal: n('eKcal'), p: n('eP'), f: n('eF'), c: n('eC'), per: v('ePer').trim() };
  if (pfc.kcal == null && pfc.p == null && pfc.f == null && pfc.c == null) {
    const g = parsePfc(v('eNut')); pfc = g ? Object.assign(g, { per: pfc.per }) : null;
  }
  const tagsIn = v('eTags').split(/[、,，]/).map(s => s.trim()).filter(Boolean);
  const d = { title: v('eTitle').trim(), tool: v('eTool').trim(), servings: v('eServ').trim(), nutrition: v('eNut').trim(),
    ingredients, steps: v('eSteps').split(/\r?\n/).map(s => s.trim().replace(/^(\d+[.．)]|[①-⑳])\s*/, '')).filter(Boolean), notes: v('eNotes').trim(), source: v('eSrc').trim(), tags: tagsIn, pfc };
  return d;
}
function saveRecipe(){
  const d = readEditForm();
  if (!d.title) { toast('料理名を入れてください'); return; }
  if (!d.tags.length) d.tags = autoTags(d);
  let r = SHEET.id ? getRecipe(SHEET.id) : null;
  if (r) Object.assign(r, d, { updated: Date.now() });
  else { r = Object.assign({ id: uid('r'), fav: false, cooked: [], created: todayStr(), updated: Date.now() }, d); S.recipes.unshift(r); }
  save();
  SHEET = { mode: 'view', id: r.id }; renderSheet(); document.getElementById('sheet').scrollTop = 0;
  toast('保存しました');
}

function foodSheetHtml(){
  const f = S.foods.find(x => x.id === SHEET.id);
  if (!f) return '';
  const uses = S.recipes.filter(r => (r.ingredients || []).some(i => !isStaple(i.name) && nameMatch(i.name, f.name)));
  let h = '<div class="sh-head"><button data-act="close-sheet">‹ 戻る</button><div class="ttl">' + esc(f.name) + '</div><button data-act="save-food">保存</button></div><div class="sh-body"><div class="card">'
    + '<div class="field"><label>名前</label><input type="text" id="fName" value="' + esc(f.name) + '"></div>'
    + '<div class="field"><label>場所</label><select id="fPlace">' + PLACES.map(p => '<option' + (p === f.place ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>'
    + '<div class="field"><label>在庫</label><div class="seg" id="fStatus">' + Object.keys(STATUS).map(k => '<button data-act="fstatus" data-v="' + k + '" class="' + (f.status === k ? 'sel' : '') + '">' + STATUS[k] + '</button>').join('') + '</div></div>'
    + '<div class="field"><label>期限（任意）</label><div class="row"><input type="date" id="fExp" value="' + esc(f.exp) + '"><button class="btn btn-ghost" style="width:72px;flex-shrink:0;padding:11px" data-act="clear-exp">消す</button></div></div>'
    + '<div class="field"><label>メモ（任意・量など）</label><input type="text" id="fMemo" value="' + esc(f.memo) + '" placeholder="残り2パック など"></div>'
    + '</div><button class="btn btn-primary" data-act="save-food">保存</button><button class="btn btn-danger" data-act="del-food">この食材を消す</button>';
  h += '<div class="card" style="margin-top:12px"><h2>この食材を使うレシピ（' + uses.length + '）</h2>' + (uses.length ? uses.map(r => '<button class="rc" style="margin-bottom:6px" data-act="open-recipe" data-id="' + r.id + '"><div class="t" style="font-size:14px">' + esc(r.title) + '</div></button>').join('') : '<div class="sub">ありません</div>') + '</div>';
  return h + '</div>';
}

// ---------- 操作 ----------
function addFood(name, place){
  name = String(name || '').trim();
  if (!name) return null;
  const ex = S.foods.find(f => norm(f.name) === norm(name));
  if (ex) { ex.status = 'have'; ex.noShop = false; ex.updated = Date.now(); if (place) ex.place = place; save(); return ex; }
  const f = { id: uid('f'), name, place: place || '冷蔵', status: 'have', exp: '', memo: '', updated: Date.now() };
  S.foods.push(f); save(); return f;
}
function addShop(name, from){
  name = String(name || '').trim(); if (!name) return false;
  // 在庫にあるものなら、在庫側を「なし」にして自動の欄に出す
  const f = S.foods.find(x => norm(x.name) === norm(name));
  if (f) { if (f.status === 'have') f.status = 'out'; f.noShop = false; f.updated = Date.now(); save(); return true; }
  if (S.shop.some(x => norm(x.name) === norm(name) && !x.done)) return false;
  S.shop.push({ id: uid('s'), name, from: from || '', done: false, added: todayStr() });
  save(); return true;
}
function missingToShop(r){
  const chk = recipeCheck(r);
  let n = 0;
  for (const m of chk.missing) { if (m.food) { m.food.status = 'out'; m.food.noShop = false; n++; } else if (addShop(m.ing.name, r.title)) n++; }
  save();
  return n;
}
function boughtFood(id){
  const f = S.foods.find(x => x.id === id); if (!f) return;
  f.status = 'have'; f.updated = Date.now(); save();
}
function shopToStock(){
  const done = S.shop.filter(x => x.done);
  for (const x of done) addFood(x.name, guessPlace(x.name));
  S.shop = S.shop.filter(x => !x.done);
  save();
  return done.length;
}
function guessPlace(name){
  const n = String(name);
  if (/冷凍/.test(n)) return '冷凍';
  if (/缶|米|麦|パスタ|乾燥|わかめ|のり|海苔|粉|だし/.test(n)) return '常温';
  if (/醤油|しょうゆ|みりん|酒|酢|ソース|ペースト|オイル|油|味噌|麹|胡椒|こしょう|砂糖|塩|チューブ|おろし|ドレッシング|コンソメ|鶏ガラ|豆板醤|コチュジャン|カレー粉|片栗粉|ほんだし/.test(n)) return '調味料';
  return '冷蔵';
}
function exportJson(){ return JSON.stringify(Object.assign({ app: 'kitchen-recipes', exportedAt: new Date().toISOString() }, S), null, 1); }
function importJson(text){
  let o; try { o = JSON.parse(text); } catch (e) { return '読めませんでした（JSONの形が違います）'; }
  if (!validState(o)) return '食材・レシピのデータではありません';
  delete o.app; delete o.exportedAt;
  const prevDeleted = S.deleted || {};
  S = o;
  if ((S.v || 1) < 3) migrate();
  S.deleted = Object.assign({}, prevDeleted, (o.deleted && typeof o.deleted === 'object') ? o.deleted : {});
  save(); return '';
}
function restoreSeed(){
  const ids = new Set(S.recipes.map(r => r.id));
  const add = seedRecipes().filter(r => !ids.has(r.id));
  S.recipes = S.recipes.concat(add); save(); return add.length;
}

function onClick(e){
  const b = e.target.closest('[data-act]'); if (!b) {
    const tb = e.target.closest('.tab-btn'); if (tb) { UI.tab = tb.dataset.tab; window.scrollTo(0, 0); render(); }
    return;
  }
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  const val = x => (document.getElementById(x) || {}).value || '';
  switch (act) {
    case 'dismiss-seed': S.seedNotice = false; save(); render(); break;
    case 'dismiss-broken': S.brokenNotice = false; save(); render(); break;
    case 'add-food': { const f = addFood(val('newFood'), val('newPlace')); if (f) toast(f.name + ' を「あり」にしました'); render(); break; }
    case 'place': UI.place = v; render(); break;
    case 'toggle-out': UI.showOut = !UI.showOut; render(); break;
    case 'setst': setFoodStatus(id, v); render(); break;
    case 'edit-food': openSheet('food', id); break;
    case 'fstatus': document.querySelectorAll('#fStatus button').forEach(x => x.classList.toggle('sel', x === b)); break;
    case 'clear-exp': document.getElementById('fExp').value = ''; break;
    case 'save-food': {
      const f = S.foods.find(x => x.id === SHEET.id); if (!f) break;
      const sel = document.querySelector('#fStatus button.sel');
      f.name = val('fName').trim() || f.name; f.place = val('fPlace') || f.place; f.exp = val('fExp'); f.memo = val('fMemo').trim();
      if (sel) f.status = sel.dataset.v;
      f.updated = Date.now(); save(); closeSheet(); toast('保存しました'); break;
    }
    case 'del-food': { const f = S.foods.find(x => x.id === SHEET.id); if (f && confirm(f.name + ' を消しますか？')) { S.foods = S.foods.filter(x => x !== f); save(); closeSheet(); } break; }
    case 'rfilter': UI.recFilter = UI.recFilter === v && v !== 'all' ? 'all' : v; render(); break;
    case 'rtag': UI.recTag = UI.recTag === v ? '' : v; render(); break;
    case 'open-recipe': openSheet('view', id); break;
    case 'new-recipe': SHEET = { mode: 'edit', id: null }; renderSheet(); document.getElementById('sheet').classList.add('on'); break;
    case 'close-sheet': closeSheet(); break;
    case 'fav': { const r = getRecipe(id); if (r) { r.fav = !r.fav; save(); renderSheet(); } break; }
    case 'cooked': { const r = getRecipe(id); if (r) { (r.cooked = r.cooked || []).push(todayStr()); save(); renderSheet(); toast('作った記録をつけました（' + r.cooked.length + '回目）'); } break; }
    case 'uncook': { const r = getRecipe(id); if (r && r.cooked && r.cooked.length) { r.cooked.pop(); save(); renderSheet(); } break; }
    case 'missing-to-shop': { const r = getRecipe(id); if (r) { const n = missingToShop(r); renderSheet(); toast(n + '品を買い物リストに入れました'); } break; }
    case 'ing-to-shop': { const r = getRecipe(id); const nm = b.dataset.name; const f = findFood(nm); if (f) { f.status = f.status === 'have' ? 'low' : f.status; f.noShop = false; save(); } else addShop(nm, r ? r.title : ''); renderSheet(); toast(nm + ' を買い物リストへ'); break; }
    case 'edit-recipe': SHEET = { mode: 'edit', id }; renderSheet(); document.getElementById('sheet').scrollTop = 0; break;
    case 'cancel-edit': SHEET = { mode: 'view', id: SHEET.id }; renderSheet(); break;
    case 'del-recipe': { const r = getRecipe(id); if (r && confirm('「' + r.title + '」を消しますか？')) { S.recipes = S.recipes.filter(x => x !== r); save(); closeSheet(); toast('消しました'); } break; }
    case 'parse-paste': {
      const p = parseRecipeText(val('pasteText'));
      if (!p.title && !p.ingredients.length) { toast('読み取れませんでした'); break; }
      SHEET.draft = Object.assign(readEditForm(), p); renderSheet();
      toast('材料' + p.ingredients.length + '・手順' + p.steps.length + 'を読み取りました。確認して保存'); break;
    }
    case 'save-recipe': saveRecipe(); break;
    case 'add-shop': { if (addShop(val('newShop'))) toast('追加しました'); render(); break; }
    case 'bought-food': boughtFood(id); toast('「あり」に戻しました'); render(); break;
    case 'noshop': { const f = S.foods.find(x => x.id === id); if (f) { f.noShop = true; save(); } render(); break; }
    case 'toggle-shop': { const x = S.shop.find(s => s.id === id); if (x) { x.done = !x.done; save(); } render(); break; }
    case 'del-shop': S.shop = S.shop.filter(s => s.id !== id); save(); render(); break;
    case 'shop-to-stock': { const n = shopToStock(); toast(n + '品を食材に入れました'); render(); break; }
    case 'export': {
      const blob = new Blob([exportJson()], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kitchen-' + todayStr() + '.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); break;
    }
    case 'copy-json': { const t = exportJson(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('コピーしました'), () => toast('コピーできませんでした')); break; }
    case 'import-text': { const t = val('importText'); if (!t.trim()) { toast('JSONを貼り付けてください'); break; } if (!confirm('今のデータを置き換えます。よいですか？')) break; const err = importJson(t); toast(err || '取り込みました'); render(); break; }
    case 'restore-seed': { const n = restoreSeed(); toast(n ? n + '品を戻しました' : '消したレシピはありません'); render(); break; }
    case 'reset': if (confirm('食材・レシピ・買い物リストをすべて初期状態に戻します。書き出していないデータは消えます。' + (SY.token ? '同期しているほかの端末も初期状態になります。' : '') + 'よいですか？')) { const d = S.deleted; S = freshState(); S.deleted = d || {}; save(); render(); toast('初期状態に戻しました'); } break;
    case 'sync-on': { const t = val('syncToken').trim(); if (!t) { toast('トークンを貼ってください'); break; } SY = { token: t }; saveSY(); render(); syncNow(); break; }
    case 'sync-now': syncNow(); break;
    case 'sync-off': if (confirm('この端末の同期を解除します（データはこの端末に残ります）')) { SY = {}; saveSY(); render(); } break;
  }
}
function onKey(e){
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.target.id === 'newFood') { const f = addFood(e.target.value, (document.getElementById('newPlace') || {}).value); if (f) toast(f.name + ' を「あり」にしました'); render(); setTimeout(() => { const el = document.getElementById('newFood'); if (el) el.focus(); }, 0); }
  if (e.target.id === 'newShop') { if (addShop(e.target.value)) toast('追加しました'); render(); setTimeout(() => { const el = document.getElementById('newShop'); if (el) el.focus(); }, 0); }
}
// 検索欄そのものは描き直さない（日本語入力の変換中に欄を作り直すと入力が壊れる）
function onInput(e){
  if (e.isComposing) return;
  const id = e.target.id;
  if (id === 'foodQ') { UI.foodQ = e.target.value; const el = document.getElementById('foodList'); if (el) el.innerHTML = foodListHtml(); }
  if (id === 'recQ') { UI.recQ = e.target.value; const el = document.getElementById('recList'); if (el) el.innerHTML = recipeListHtml(); }
}
function onChange(e){
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { if (!confirm('今のデータを置き換えます。よいですか？')) return; const err = importJson(fr.result); toast(err || '取り込みました'); render(); };
    fr.readAsText(e.target.files[0]);
  }
}

// ---------- 起動 ----------
load();
document.addEventListener('click', onClick);
document.addEventListener('keydown', onKey);
document.addEventListener('input', onInput);
document.addEventListener('compositionend', onInput);
document.addEventListener('change', onChange);
render();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());
syncNow();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
